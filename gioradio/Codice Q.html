  var KEY = 'lock:' + D.section;
  var subtle = window.crypto && crypto.subtle;
  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }

  async function derive(pw) {
    var base = await subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', salt: bytes(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, 256));
  }
  async function unlock(raw) {
    var key = await subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var gz = await subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, key, bytes(D.data));
    var html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }

  var f = document.getElementById('f'), p = document.getElementById('p'),
      b = document.getElementById('b'), e = document.getElementById('e');
  function ask() { f.hidden = false; p.focus(); }

  if (!subtle || !window.DecompressionStream) { f.hidden = false; e.textContent = 'Browser non supportato.'; b.disabled = true; return; }

  // saved key: "salt|key", valid only for the salt it was derived with
  var saved = null;
  try { saved = (localStorage.getItem(KEY) || '').split('|'); } catch (err) {}
  if (saved && saved[0] === D.salt && saved[1]) unlock(bytes(saved[1])).catch(ask);
  else ask();

  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    b.disabled = true; e.textContent = '';
    try {
      var raw = await derive(p.value);
      await unlock(raw);
      try { localStorage.setItem(KEY, D.salt + '|' + b64(raw)); } catch (err) {}
    } catch (err) {
      e.textContent = 'Password errata.';
      b.disabled = false; p.select();
    }
  });

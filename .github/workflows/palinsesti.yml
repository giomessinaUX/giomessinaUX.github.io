name: Aggiorna palinsesti GioRadio

# Reads the schedules from the radio stations' websites and commits
# gioradio/palinsesti.json; GitHub Pages republishes the site on its own.
# Start it by hand from the "Aggiorna dai siti delle radio" button on
# gioradio/palinsesti-radio-milano.html (Actions → Run workflow), or let the
# weekly run do it.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"   # every Monday, 03:30 UTC

permissions:
  contents: write

concurrency:
  group: palinsesti
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leggi i palinsesti dai siti delle radio
        run: python3 _tools/gioradio/palinsesti.py gioradio/palinsesti.json

      - name: Salva se qualcosa è cambiato
        run: |
          if git diff --quiet -- gioradio/palinsesti.json; then
            echo "Nessuna modifica."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add gioradio/palinsesti.json
          git commit -m "GioRadio: aggiorna palinsesti"
          git push
